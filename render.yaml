services:
  - type: web
    name: assistente-ia
    runtime: node
    # Plano grátis: bom para testar. Adormece após 15 min sem uso e perde os
    # dados (definições e chamadas) quando reinicia. Para atender chamadas a
    # sério, muda para "starter" e descomenta o disco e o DATA_DIR abaixo.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /saude
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # - key: DATA_DIR
      #   value: /var/data
      # IA a usar: "gemini" (grátis, chave em aistudio.google.com) ou
      # "claude" (pago, chave em console.anthropic.com).
      - key: IA
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Postgres do Neon (definições, tarefas e chamadas sobrevivem a reinícios)
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAINEL_SENHA
        sync: false
      - key: SEGREDO_SESSAO
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_NUMERO
        sync: false
